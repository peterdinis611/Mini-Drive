name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mini_drive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mini_drive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mini_drive
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mini_drive
      REDIS_URL: redis://127.0.0.1:6379
      AUDIT_IP_PEPPER: ci-audit-pepper-not-for-production-use-32b
      SHARE_PASSWORD_PEPPER: ci-share-pepper-not-for-production-use-32
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Sync schema
        # Source of truth is src/db/schema.ts; additive SQL lives in drizzle/ for hosts that prefer migrate.
        run: pnpm exec drizzle-kit push --force

      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
        run: pnpm build
