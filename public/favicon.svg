<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Mini Drive">
  <title>Mini Drive</title>
  <style>
    .tile { fill: url(#md-bg); }
    .tray { fill: #fff; }
    .pull { fill: #2f6fed; }
    .spark-ring { fill: #dbe7ff; }
    .spark-core { fill: #2f6fed; }
    .sheen { fill: url(#md-sheen); }
    @media (prefers-color-scheme: dark) {
      .tile { fill: url(#md-bg-dark); }
      .tray { fill: #071018; }
      .pull { fill: #7eb8ff; }
      .spark-ring { fill: #eef3f8; }
      .spark-core { fill: #071018; }
      .sheen { opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="md-bg" x1="6" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4d8af5"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
    <linearGradient id="md-bg-dark" x1="6" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9bccff"/>
      <stop offset="1" stop-color="#7eb8ff"/>
    </linearGradient>
    <linearGradient id="md-sheen" x1="8" y1="6" x2="22" y2="26" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect class="tile" width="32" height="32" rx="9"/>
  <rect class="sheen" width="32" height="32" rx="9"/>

  <!-- Archive drawers -->
  <rect class="tray" x="8" y="8" width="16" height="4.5" rx="1.4"/>
  <rect class="tray" x="8" y="14" width="16" height="4.5" rx="1.4" opacity="0.92"/>
  <rect class="tray" x="8" y="20" width="16" height="4.5" rx="1.4" opacity="0.84"/>

  <!-- Drawer pulls -->
  <rect class="pull" x="14.25" y="9.55" width="3.5" height="1.4" rx="0.7"/>
  <rect class="pull" x="14.25" y="15.55" width="3.5" height="1.4" rx="0.7"/>
  <rect class="pull" x="14.25" y="21.55" width="3.5" height="1.4" rx="0.7"/>

  <!-- Safe-url spark -->
  <circle class="spark-ring" cx="22.2" cy="10.25" r="1.55"/>
  <circle class="spark-core" cx="22.2" cy="10.25" r="0.7"/>
</svg>
