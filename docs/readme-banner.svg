<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-label="Mini Drive — WIP archive">
  <title>Mini Drive — active development</title>
  <desc>Animated banner: archive drawers, safe-url pulse, WIP badge</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e121a"/>
      <stop offset="55%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#1a2740"/>
    </linearGradient>
    <linearGradient id="mesh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6fed" stop-opacity="0"/>
      <stop offset="45%" stop-color="#2f6fed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7eb8ff" stop-opacity="0"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="drawer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef3f8"/>
      <stop offset="100%" stop-color="#c9d5e8"/>
    </linearGradient>
    <linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4d8af5"/>
      <stop offset="100%" stop-color="#2f6fed"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="960" height="280" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="960" height="280" fill="url(#bg)"/>
    <rect width="960" height="280" fill="url(#mesh)" opacity="0.9"/>

    <g stroke="#7eb8ff" stroke-opacity="0.08" stroke-width="1">
      <path d="M0 70 H960 M0 140 H960 M0 210 H960"/>
      <path d="M120 0 V280 M240 0 V280 M360 0 V280 M480 0 V280 M600 0 V280 M720 0 V280 M840 0 V280"/>
    </g>

    <rect x="0" y="0" width="960" height="2" fill="#7eb8ff" opacity="0.55">
      <animate attributeName="y" values="0;278;0" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(72 48)">
      <rect x="0" y="0" width="168" height="184" rx="18" fill="#1a2030" stroke="#7eb8ff" stroke-opacity="0.35" stroke-width="2"/>
      <rect x="10" y="12" width="148" height="160" rx="12" fill="#0e121a"/>

      <g>
        <rect x="22" y="28" width="124" height="36" rx="8" fill="url(#drawer)"/>
        <rect x="70" y="42" width="28" height="8" rx="4" fill="#2f6fed"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 18 0; 0 0" dur="3.2s" begin="0s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="22" y="76" width="124" height="36" rx="8" fill="url(#drawer)" opacity="0.95"/>
        <rect x="70" y="90" width="28" height="8" rx="4" fill="#2f6fed"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 28 0; 0 0" dur="3.2s" begin="0.55s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="22" y="124" width="124" height="36" rx="8" fill="url(#drawer)" opacity="0.88"/>
        <rect x="70" y="138" width="28" height="8" rx="4" fill="#2f6fed"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; 12 0; 0 0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      </g>
    </g>

    <g font-family="Sora, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#eef3f8">
      <g>
        <rect x="280" y="64" width="132" height="34" rx="10" fill="#1a2030" stroke="#2f6fed" stroke-opacity="0.55"/>
        <text x="296" y="86">brief-q4.pdf</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="300" y="118" width="148" height="34" rx="10" fill="#1a2030" stroke="#7eb8ff" stroke-opacity="0.4"/>
        <text x="316" y="140">hero-crop.png</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="4.6s" begin="0.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <rect x="270" y="172" width="156" height="34" rx="10" fill="#1a2030" stroke="#2f6fed" stroke-opacity="0.45"/>
        <text x="286" y="194">safe-url · 15m</text>
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3.8s" begin="0.8s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(480 78)" font-family="Sora, ui-sans-serif, system-ui, sans-serif">
      <text x="0" y="0" font-size="54" font-weight="700" fill="#eef3f8" letter-spacing="-1.5">
        Mini Drive
      </text>
      <text x="0" y="42" font-size="20" fill="#8b97a8">
        súkromný archív so safe-url
      </text>

      <rect x="318" y="26" width="3" height="22" fill="#7eb8ff">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>

      <g transform="translate(0 68)">
        <rect width="236" height="36" rx="18" fill="#1a2740" stroke="#2f6fed" stroke-width="1.5">
          <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
        </rect>
        <circle cx="22" cy="18" r="5" fill="#2f6fed" filter="url(#glow)">
          <animate attributeName="r" values="4;6;4" dur="2.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="38" y="23" font-size="14" font-weight="600" fill="#7eb8ff" letter-spacing="0.06em">
          WIP · STÁLE SA VYVÍJA
        </text>
      </g>

      <g transform="translate(0 128)" fill="#2f6fed">
        <rect x="0" y="0" width="48" height="6" rx="3" opacity="0.95">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <rect x="56" y="0" width="48" height="6" rx="3" opacity="0.7">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" begin="0.25s" repeatCount="indefinite"/>
        </rect>
        <rect x="112" y="0" width="48" height="6" rx="3" opacity="0.45">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="168" y="0" width="48" height="6" rx="3" opacity="0.25">
          <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.6s" begin="0.75s" repeatCount="indefinite"/>
        </rect>
        <rect x="224" y="0" width="48" height="6" rx="3" fill="#283044" opacity="0.9"/>
      </g>
    </g>

    <g transform="translate(860 140)">
      <circle r="46" fill="none" stroke="#7eb8ff" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="10" fill="url(#cobalt)" filter="url(#glow)">
        <animate attributeName="r" values="9;12;9" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <g>
        <circle cx="38" cy="0" r="5" fill="#7eb8ff">
          <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
  </g>
</svg>
